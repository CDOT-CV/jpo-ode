name: ci

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - "develop"
      - "master"
      - "release/*"
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Run the same Maven build as the publish workflows, minus GPG signing and the upload, so
  # publishing failures (javadoc doclint, flatten, sources) show up on the PR instead of at
  # release time. The enforcer check that a release has no SNAPSHOT dependencies is skipped
  # here, because between releases a release version may depend on a jpo-asn-pojos snapshot;
  # the release workflow still enforces it.
  maven-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6.2.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
      - name: Verify release build
        run: |
          mvn -P release,package-jar --batch-mode verify -Dgpg.skip -Denforcer.skip -DskipTests \
            --projects :jpo-ode-common,:jpo-ode-plugins,:jpo-ode-core,:jpo-ode-svcs

  sonar:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Run Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -e clean verify sonar:sonar \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'usdot.jpo.ode:jpo-ode' }} \
            -Dsonar.projectName=jpo-ode \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || github.repository_owner }} \
            -Dsonar.host.url=https://sonarcloud.io
