name: DockerHub Build and Push

on:
  push:
    branches: [ master, develop, release/*]
    tags:     [ "*" ] 
  workflow_dispatch:
  
jobs:
  publish:
    # Only the usdot-jpo-ode repository publishes the usdotjpoode/jpo-ode image; skip in forks
    if: github.repository == 'usdot-jpo-ode/jpo-ode'
    uses: usdot-jpo-ode/actions/.github/workflows/dockerhub.yml@main
    with:
      image: usdotjpoode/jpo-ode
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN:   ${{ secrets.DOCKERHUB_TOKEN }}